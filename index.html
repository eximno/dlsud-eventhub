<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DLSUD EventHub</title>
    <meta name="description" content="DLSUD EventHub - a student prototype campus event registration system. Redirects to the application.">
    <!-- GitHub Pages entry point.
         Pages is configured to serve the repository ROOT so that the frontend
         can fetch ../database/schema.sql and ../database/seed.sql. This page
         only forwards visitors to the application, and stays usable if the
         redirect is blocked. -->
    <link rel="canonical" href="frontend/index.html">
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23115437'/%3E%3Crect y='26' width='32' height='6' rx='2' fill='%23b8871b'/%3E%3Ctext x='16' y='20' font-family='Arial,Helvetica,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EEH%3C/text%3E%3C/svg%3E">
    <style>
        body { font-family: "Segoe UI", Roboto, Arial, sans-serif; margin: 0;
               min-height: 100vh; display: grid; place-items: center;
               background: #07301f; color: #fff; padding: 1.5rem; }
        main { max-width: 36rem; text-align: center; }
        h1 { font-size: clamp(1.6rem, 1.2rem + 2vw, 2.4rem); margin: 0 0 .5rem; }
        p { color: #c9ded3; line-height: 1.6; }
        a.btn { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem;
                background: #fff; color: #07301f; font-weight: 700;
                border-radius: 6px; text-decoration: none;
                border-bottom: 3px solid #b8871b; }
        a.btn:focus-visible { outline: 3px solid #b8871b; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>DLSUD EventHub</h1>
        <p>
            Opening the event catalog. If nothing happens, use the link below.
            This is a 4th-year BSIT laboratory prototype and is not an official
            De La Salle University-Dasmarinas system.
        </p>
        <a class="btn" href="frontend/index.html">Open DLSUD EventHub</a>
    </main>
</body>
</html>
